name: Release

# Cutting a release is one command:
#
#     git tag v0.4.0 && git push origin v0.4.0
#
# Everything below is what happens next. `workflow_dispatch` builds the same
# archives without publishing anything, so the machinery can be exercised
# before a tag exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag that disagrees with the manifest produces archives whose name and
  # contents say different things, which is the sort of thing nobody notices
  # until they are debugging the wrong binary.
  check-version:
    name: The tag matches the manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "workspace version: $manifest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::tag v$tag does not match the workspace version $manifest" >&2
              exit 1
            fi
          fi

  build:
    name: ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # An arm64 runner rather than a cross-compile from x86_64, because
          # "The archived binary works" below actually runs what it packed, and
          # that is the one property this job exists to hold. Cross-compiling
          # would mean either shipping a binary nothing executed or a linker
          # and an emulator to execute it with. Free for public repositories;
          # if this repository ever goes private, this line is what to revisit.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from Apple silicon, because the Intel runner image
          # (`macos-13`) has been retired: a job asking for it queues forever
          # rather than failing, which is how 0.4.0-rc.1 found this. The Xcode
          # toolchain targets x86_64 natively, and the runner has Rosetta, so
          # the archived binary is still executed before it ships — the one
          # property this job exists to hold.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The archive carries the toolchain, the reference tool server and the
      # editor-facing language server.
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p ingot-cli --bin ingot
          cargo build --release --locked --target ${{ matrix.target }} -p ingot-mcp --bin ingot-mcp-fs
          cargo build --release --locked --target ${{ matrix.target }} -p ingot-lsp --bin ingot-lsp

      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: |
          name="ingot-${{ needs.check-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/ingot "dist/$name/"
          cp target/${{ matrix.target }}/release/ingot-mcp-fs "dist/$name/"
          cp target/${{ matrix.target }}/release/ingot-lsp "dist/$name/"
          cp README.md LICENSE NOTICE CHANGELOG.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          shasum -a 256 "dist/$name.tar.gz" | sed "s| dist/| |" > "dist/$name.tar.gz.sha256"

      - name: Archive (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="ingot-${{ needs.check-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/ingot.exe "dist/$name/"
          cp target/${{ matrix.target }}/release/ingot-mcp-fs.exe "dist/$name/"
          cp target/${{ matrix.target }}/release/ingot-lsp.exe "dist/$name/"
          cp README.md LICENSE NOTICE CHANGELOG.md "dist/$name/"
          7z a -tzip "dist/$name.zip" "./dist/$name/*"
          certutil -hashfile "dist/$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "dist/$name.zip.sha256.raw"
          echo "$(cat dist/$name.zip.sha256.raw)  $name.zip" > "dist/$name.zip.sha256"
          rm "dist/$name.zip.sha256.raw"

      # The archive is only worth shipping if the binary in it runs, so it is
      # unpacked and asked a question here rather than by whoever downloads it.
      - name: The archived binary works
        shell: bash
        run: |
          name="ingot-${{ needs.check-version.outputs.version }}-${{ matrix.target }}"
          "dist/$name/ingot${{ runner.os == 'Windows' && '.exe' || '' }}" --version
          "dist/$name/ingot-lsp${{ runner.os == 'Windows' && '.exe' || '' }}" --version
          "dist/$name/ingot${{ runner.os == 'Windows' && '.exe' || '' }}" \
            check --color never examples/document-summarizer

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Signing is its own job, and it runs on a dispatch as well as on a tag. The
  # whole point of `workflow_dispatch` here is that the machinery can be
  # exercised before a tag exists — and signing is the part most worth exercising,
  # because it depends on an identity token, a certificate authority and a
  # transparency log that are all outside this repository.
  sign:
    name: Sign the checksums
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole of keyless signing is this line. The job asks GitHub for a
      # short-lived OIDC token; Fulcio exchanges it for a certificate that names
      # *this workflow file at this ref*; the signature is that certificate plus
      # an entry in a public transparency log. There is no private key here, so
      # there is none to leak, rotate, or keep off a laptop.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One file of checksums, so a download can be verified in one step
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      # Pinned rather than floating. The bundle format is what a documented
      # verification command depends on, and "whatever cosign released this
      # morning" is not something to make that promise out of.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      # One signature, over the file that holds every archive's hash. Signing
      # each archive separately would produce five signatures that say the same
      # thing, and a verification story with a step per platform.
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      # Verified here, immediately, with the exact identity this job runs under.
      # A signature nobody has checked is a file, and finding out that it does not
      # verify should not be the job of the first person who tries.
      - name: Verify what was just signed
        env:
          # The exact identity, not a pattern: this job knows which workflow file
          # at which ref it is, so it can assert that the certificate says the
          # same. A pattern here would pass for a signature made by a workflow
          # this is not.
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          ISSUER: https://token.actions.githubusercontent.com
        run: cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: signed-checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [check-version, build, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `SHA256SUMS` is **not** rebuilt here. It arrives from the job that signed
      # it, byte for byte, because a signature over a file assembled twice is a
      # signature over whichever copy happened to be signed. The per-target
      # `.sha256` files are what that one file replaces.
      - name: Keep the signed checksums, drop the per-archive ones
        run: |
          cd dist
          rm -f *.sha256
          test -s SHA256SUMS
          test -s SHA256SUMS.sigstore.json
          ls -la

      # Pre-1.0, so every release is marked as such: the language, the IR and
      # the artifact format can still change between them.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Ingot ${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          Verify a download against \`SHA256SUMS\`:

          \`\`\`
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          That proves the download was not corrupted. It cannot prove who built it, because \`SHA256SUMS\` comes from the same host as the archive. This does, and it needs no key of ours to be trusted — the certificate names the workflow that ran:

          \`\`\`
          cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' SHA256SUMS
          \`\`\`

          The signature is public: keyless signing writes the certificate and the file's digest into a public transparency log, which is what makes it checkable by somebody who has never met us.

          Each archive carries \`ingot\`, \`ingot-mcp-fs\` and \`ingot-lsp\`. Pre-1.0: the language, the Agent IR and the artifact format may change between releases." \
            --prerelease \
            dist/*
