name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features
      # The interpreter and its tests must build with no HTTP or TLS stack, so
      # the dependency stays confined to the optional `anthropic` feature.
      - name: Runtime builds without the provider feature
        run: cargo test -p ingot-runtime --no-default-features
      # The IR must be byte-identical on every platform, not just on Linux.
      # Golden files are checked in; a platform-dependent encoding fails here.
      - name: Golden IR is platform independent
        run: cargo test -p ingot-compiler --test golden_ir

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  examples:
    name: Reference examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - name: Examples check cleanly
        run: |
          for example in examples/*/; do
            echo "::group::ingot check $example"
            ./target/debug/ingot check --color never "$example"
            echo "::endgroup::"
          done
      - name: Examples are canonically formatted
        run: |
          for example in examples/*/; do
            ./target/debug/ingot fmt --check --color never "$example"
          done
      - name: Build output is reproducible across runs
        run: |
          ./target/debug/ingot build examples/research-agent --out-dir /tmp/first
          ./target/debug/ingot build examples/research-agent --out-dir /tmp/second
          diff -r /tmp/first /tmp/second
      - name: A generated project checks and builds
        run: |
          ./target/debug/ingot init /tmp/scaffold
          ./target/debug/ingot check --color never /tmp/scaffold
          ./target/debug/ingot build --color never /tmp/scaffold
          test -f /tmp/scaffold/target/ingot/Brief.ir.json
      # A directory named after a reserved word used to generate a project that
      # would not compile.
      - name: A project named after a keyword still compiles
        run: |
          ./target/debug/ingot init /tmp/agent
          ./target/debug/ingot check --color never /tmp/agent
      - name: Recorded cassettes still replay
        run: |
          for example in examples/*/; do
            if [ -d "$example/tests/cassettes" ]; then
              ./target/debug/ingot test --color never "$example"
            fi
          done
      # `repo-digest` is the example whose tools are all served by the server
      # this repository ships, so its wiring is checkable end to end here.
      - name: Every declared tool of repo-digest resolves to a server
        run: |
          export PATH="$PWD/target/debug:$PATH"
          ./target/debug/ingot tools --color never examples/repo-digest
      # An agent that declares a tool with nothing to serve it must exit
      # non-zero here, rather than looking fine until the first call fails at
      # run time. `research-agent` needs a web search server, which this
      # repository deliberately does not ship.
      - name: An unserved tool is reported, not discovered at run time
        run: |
          if ./target/debug/ingot tools --color never examples/research-agent; then
            echo "expected a non-zero exit for an unserved tool" >&2
            exit 1
          fi

  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # The gap register, the specs, the RFCs and the ADRs cross-reference each
      # other heavily. A register full of dead links reads as maintained and is
      # not.
      - name: Documentation cross-references resolve
        run: python3 scripts/check-links.py
