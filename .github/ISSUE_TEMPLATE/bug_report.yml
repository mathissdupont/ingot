name: Bug report
description: The compiler did something wrong
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security issue — a capability escape, a policy bypass, a secret
        leak — do not open an issue. See SECURITY.md.

  - type: textarea
    id: source
    attributes:
      label: Source
      description: The smallest `.ing` file that reproduces the problem.
      render: text
      placeholder: |
        language 0.1

        agent A(topic: string) -> report<markdown> {
          flow {
            emit report = ask<markdown>("${topic}")
          }
        }
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      placeholder: ingot check main.ing
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Full output, including any diagnostic codes.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parsing or diagnostics
        - Types
        - Effects, capabilities or policy
        - Budgets and static bounds
        - Lowering or IR
        - CLI
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ingot --version`, or the commit hash.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11, Rust 1.92.0
    validations:
      required: true
