[package]
name = "ingot-runtime"
description = "Reference interpreter for the Ingot Agent IR: executes an agent and enforces its policy and budgets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Network model providers. Off by default so the core interpreter, and its
# tests, carry no TLS or HTTP dependency. Both share `http.rs`, so the retry
# rule and the timeout are the same whichever service answers.
anthropic = ["dep:ureq"]
openai = ["dep:ureq"]

[dependencies]
ingot-ir.workspace = true
ingot-types.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
ureq = { version = "3.3", features = ["json"], optional = true }
