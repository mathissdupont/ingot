[package]
name = "ingot-mcp"
description = "Model Context Protocol tool host for Ingot: serves an agent's declared tools from MCP servers over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# `cargo binstall <crate>` fetches the release archive instead of compiling the
# workspace on somebody's machine. It costs nothing to support: the archives are
# already named this way and already carry all three binaries, so this is only
# telling `cargo-binstall` where to look and what is inside.
#
# Unaffected by the releases being marked pre-release, because the version is
# resolved from crates.io rather than from GitHub's `releases/latest` — which
# returns 404 here, and is the wall a hand-written installer hits first.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ingot-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "ingot-{ version }-{ target }/{ bin }{ binary-ext }"

# The Windows zip is flat where the tarballs carry a top-level directory
# (`7z a ... "./dist/$name/*"` against `tar -C dist "$name"`). Both are already
# published that way, so the difference is described rather than corrected.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[features]
default = []
# The Streamable HTTP transport. Off by default, mirroring `ingot-runtime`'s
# own `http` feature: a build that hosts only local servers carries no TLS
# stack.
http = ["dep:ureq"]

[dependencies]
ingot-runtime.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3.3", features = ["json"], optional = true }

[dev-dependencies]
# Only to show, in a doc example, the TOML an operator actually writes.
toml = { workspace = true }

# A sandboxed reference server, so that a fresh checkout has something to point
# `[[mcp.server]]` at without installing anything else. It is also what the
# integration tests spawn, which keeps the tested path the shipped path.
[[bin]]
name = "ingot-mcp-fs"
path = "src/bin/fs_server.rs"
